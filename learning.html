<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>শেখার পাঠশালা — Garments OT Tracker</title><style>:root{font-family:system-ui,'Noto Sans Bengali',sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a}header{background:#047857;color:white;padding:16px;position:sticky;top:0;z-index:2}header a{color:white}main{max-width:760px;margin:auto;padding:16px}.card{background:white;border:1px solid #cbd5e1;border-radius:14px;padding:16px;margin:12px 0}button,input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #94a3b8}button{cursor:pointer;background:#047857;color:white;border:0}button:focus-visible,input:focus-visible{outline:3px solid #2563eb}input,textarea{width:100%}textarea{resize:vertical}.secondary{background:#475569} .bar{height:12px;background:#cbd5e1;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:#059669}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.topic{text-align:left;background:#e2e8f0;color:#0f172a}.topic[aria-pressed=true]{background:#047857;color:white}.muted{color:#475569}pre{white-space:pre-wrap;background:#0f172a;color:#e2e8f0;padding:14px;border-radius:10px;overflow:auto}label{display:block;margin:9px 0}.choice{display:block;width:100%;text-align:left;margin:8px 0;background:#e2e8f0;color:#0f172a}.correct{background:#dcfce7;color:#14532d}.wrong{background:#fee2e2;color:#7f1d1d}</style></head><body><header><a href="index.html">← হাজিরা ও OT অ্যাপে ফিরুন</a><h2>📚 শেখার পাঠশালা</h2><small>৩৪টি বিষয় • বাংলা পাঠ • কুইজ • অগ্রগতি</small></header><main><div class="card"><label for="search">বিষয় খুঁজুন</label><input id="search" placeholder="যেমন Python, Excel, Git"><p id="progress" aria-live="polite"></p><div class="grid"><button id="exportProgress" type="button">অগ্রগতি ডাউনলোড</button><button id="resetProgress" type="button" class="secondary">অগ্রগতি রিসেট</button></div><div class="bar" role="progressbar" aria-label="শেখার অগ্রগতি" aria-valuemin="0" aria-valuemax="34" aria-valuenow="0" id="progressBar"><span id="progressFill" style="width:0%"></span></div><div id="topics" class="grid" style="margin-top:12px"></div></div><section id="lesson" class="card" aria-live="polite"></section><section class="card"><h3>📝 নিজের প্র্যাকটিস নোট</h3><label for="practiceNote">নির্বাচিত বিষয়ের নোট লিখুন</label><textarea id="practiceNote" maxlength="2000" rows="5" placeholder="আজ কী শিখলেন? কোন কোড বা কমান্ড অনুশীলন করবেন?"></textarea><p class="muted">নোট এই ডিভাইসে স্বয়ংক্রিয়ভাবে সেভ হয়।</p></section><p class="muted">শেখার অগ্রগতি এই ডিভাইসে সংরক্ষিত হয়। এটি প্রাথমিক অনুশীলন; পূর্ণ কোর্স বা কোড রানার নয়।</p></main><script>
'use strict';
const topics=[["HTML","ওয়েবপেজের কাঠামো","\u003ch1> শিরোনাম তৈরি করে","\u003ch1>"],["CSS","রং ও ডিজাইন","color প্রপার্টি লেখার রং বদলায়","color"],["JavaScript","ওয়েবের ইন্টারঅ্যাকশন","let দিয়ে ভ্যারিয়েবল তৈরি হয়","let"],["SQL","ডাটাবেজ কুয়েরি","SELECT দিয়ে তথ্য পড়া হয়","SELECT"],["Python","সহজ প্রোগ্রামিং","print() দিয়ে আউটপুট দেখানো হয়","print()"],["Java","অবজেক্ট ও ক্লাস","class দিয়ে ক্লাস ঘোষণা করা হয়","class"],["C","সিস্টেম প্রোগ্রামিং","printf() দিয়ে আউটপুট দেখানো হয়","printf()"],["C++","অবজেক্ট ও পারফরম্যান্স","cout দিয়ে আউটপুট দেখানো হয়","cout"],["C#",".NET অ্যাপ","Console.WriteLine() আউটপুট দেয়","Console.WriteLine()"],["PHP","সার্ভার-সাইড ওয়েব","echo দিয়ে লেখা দেখানো হয়","echo"],["React","কম্পোনেন্টভিত্তিক UI","useState দিয়ে স্টেট রাখা হয়","useState"],["MySQL","রিলেশনাল ডাটাবেজ","CREATE TABLE দিয়ে টেবিল তৈরি হয়","CREATE TABLE"],["Excel","স্প্রেডশিট হিসাব","SUM() দিয়ে সংখ্যা যোগ হয়","SUM()"],["DSA","ডাটা স্ট্রাকচার ও অ্যালগরিদম","Stack হলো LIFO ডাটা স্ট্রাকচার","LIFO"],["Bootstrap 3","রেসপনসিভ লেআউট","col-md-6 হলো গ্রিড ক্লাস","col-md-6"],["Bootstrap 4","ফ্লেক্সবক্স UI","d-flex দিয়ে flex display হয়","d-flex"],["Bootstrap 5","আধুনিক UI","container দিয়ে লেআউট সীমাবদ্ধ হয়","container"],["Node.js","সার্ভার JavaScript","Node.js ব্রাউজারের বাইরে JS চালায়","Node.js"],["TypeScript","টাইপসহ JavaScript","string হলো টেক্সট টাইপ","string"],["Django","Python ওয়েব ফ্রেমওয়ার্ক","models.py-তে ডাটা মডেল লেখা হয়","models.py"],["PostgreSQL","উন্নত SQL ডাটাবেজ","RETURNING দিয়ে পরিবর্তিত সারি ফেরত আসে","RETURNING"],["jQuery","DOM সহজে নিয়ন্ত্রণ","$() দিয়ে element নির্বাচন করা হয়","$()"],["NumPy","সংখ্যাগত অ্যারে","array() দিয়ে অ্যারে বানানো যায়","array()"],["Pandas","ডাটা বিশ্লেষণ","DataFrame হলো টেবিলের মতো ডাটা","DataFrame"],["Angular","TypeScript ফ্রেমওয়ার্ক","@Component দিয়ে কম্পোনেন্ট নির্ধারণ হয়","@Component"],["Git","কোড ভার্সন কন্ট্রোল","git commit পরিবর্তন সংরক্ষণ করে","git commit"],["MongoDB","ডকুমেন্ট ডাটাবেজ","find() দিয়ে ডকুমেন্ট খোঁজা হয়","find()"],["R","পরিসংখ্যান ও বিশ্লেষণ","mean() গড় নির্ণয় করে","mean()"],["Go","দ্রুত ব্যাকএন্ড","func দিয়ে ফাংশন তৈরি হয়","func"],["Kotlin","Android ডেভেলপমেন্ট","val দিয়ে অপরিবর্তনীয় রেফারেন্স তৈরি হয়","val"],["Swift","iOS ডেভেলপমেন্ট","let দিয়ে কনস্ট্যান্ট তৈরি হয়","let"],["Vue","সহজ reactive UI","v-if শর্ত অনুযায়ী element দেখায়","v-if"],["SciPy","বৈজ্ঞানিক গণনা","scipy.optimize অপ্টিমাইজেশনে ব্যবহৃত হয়","scipy.optimize"],["Bash","টার্মিনাল অটোমেশন","pwd বর্তমান ফোল্ডার দেখায়","pwd"]];
const storeKey='garmentsLearningProgressV1';
let done={};try{const v=JSON.parse(localStorage.getItem(storeKey)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))done=v;}catch(e){}
let current=0;const noteKey='garmentsLearningNotesV1';let notes={};try{const n=JSON.parse(localStorage.getItem(noteKey)||'{}');if(n&&typeof n==='object'&&!Array.isArray(n))notes=n;}catch(e){}
const el=id=>document.getElementById(id);
function save(){try{localStorage.setItem(storeKey,JSON.stringify(done));}catch(e){}}function saveNotes(){try{localStorage.setItem(noteKey,JSON.stringify(notes));}catch(e){}}function renderNote(){el('practiceNote').value=typeof notes[current]==='string'?notes[current]:'';}
function renderTopics(){const q=el('search').value.trim().toLowerCase();el('topics').replaceChildren();topics.forEach((t,i)=>{if(!t[0].toLowerCase().includes(q)&&!t[1].toLowerCase().includes(q))return;const b=document.createElement('button');b.className='topic';b.type='button';b.setAttribute('aria-pressed',String(current===i));b.textContent=(done[i]?'✓ ':'')+t[0];b.addEventListener('click',()=>{current=i;renderTopics();renderLesson();renderNote();});el('topics').append(b);});const count=Object.keys(done).filter(k=>done[k]&&Number(k)>=0&&Number(k)<topics.length).length;el('progress').textContent='সম্পন্ন: '+count+' / '+topics.length+' ('+Math.round(count/topics.length*100)+'%)';el('progressBar').setAttribute('aria-valuenow',String(count));el('progressFill').style.width=(count/topics.length*100)+'%';}
function renderLesson(){const t=topics[current];const area=el('lesson');area.replaceChildren();const h=document.createElement('h2');h.textContent=t[0]+' — '+t[1];area.append(h);const p=document.createElement('p');p.textContent='আজকের পাঠ: '+t[2]+'। নিচের প্রশ্নের উত্তর দিয়ে অনুশীলন করুন।';area.append(p);const pre=document.createElement('pre');pre.textContent='মূল শব্দ / কমান্ড: '+t[3];area.append(pre);const q=document.createElement('h3');q.textContent=t[0]+'-এ এই পাঠের সঠিক শব্দ বা কমান্ড কোনটি?';area.append(q);const choices=[t[3],topics[(current+7)%topics.length][3],topics[(current+17)%topics.length][3]].sort((a,b)=>a.localeCompare(b));const feedback=document.createElement('p');feedback.setAttribute('role','status');choices.forEach(value=>{const b=document.createElement('button');b.className='choice';b.textContent=value;b.addEventListener('click',()=>{const ok=value===t[3];feedback.textContent=ok?'সঠিক উত্তর! এই বিষয়টি সম্পন্ন হয়েছে।':'আবার চেষ্টা করুন। পাঠের মূল শব্দটি দেখুন।';feedback.className=ok?'correct':'wrong';if(ok){done[current]=true;save();renderTopics();} });area.append(b);});area.append(feedback);const next=document.createElement('button');next.textContent='পরের বিষয় →';next.addEventListener('click',()=>{current=(current+1)%topics.length;renderTopics();renderLesson();renderNote();window.scrollTo(0,0);});area.append(next);}
el('search').addEventListener('input',renderTopics);
el('practiceNote').addEventListener('input',()=>{notes[current]=el('practiceNote').value.slice(0,2000);saveNotes();});
el('resetProgress').addEventListener('click',()=>{if(confirm('সব বিষয়ের কুইজ অগ্রগতি মুছে ফেলবেন? আপনার নোট অক্ষত থাকবে।')){done={};save();renderTopics();}});
el('exportProgress').addEventListener('click',()=>{const payload={version:1,exportedAt:new Date().toISOString(),completed:topics.filter((t,i)=>done[i]).map(t=>t[0]),notes:Object.fromEntries(topics.map((t,i)=>[t[0],typeof notes[i]==='string'?notes[i]:'']).filter(x=>x[1]))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='learning-progress.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});
renderTopics();renderLesson();renderNote();
</script></body></html>
