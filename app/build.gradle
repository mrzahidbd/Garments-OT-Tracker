plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mrzahidbd.garmentsot'
    compileSdk 36

    sourceSets.main.assets.setSrcDirs([layout.buildDirectory.dir('generated/trackerAssets').get().asFile])

    defaultConfig {
        applicationId 'com.mrzahidbd.garmentsot'
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName '1.1.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
