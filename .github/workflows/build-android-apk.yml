name: Build Android APK

on:
  push:
    branches: [main, build/play-1.0.1]
    paths:
      - 'index.html'
      - 'learning.html'
      - 'platform-files.js'
      - 'app/**'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android 16 build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Package offline web assets
        run: |
          python3 tools/prepare-android-assets.py
          npx --yes --package=tailwindcss@3.4.17 -- tailwindcss -c tools/tailwind.android.cjs -i tools/tailwind.android.css -o app/src/main/assets/tracker.css --minify

      - name: Build APKs and Play bundle
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Check bundle and collect unsigned release files
        run: |
          set -euo pipefail
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$bundletool"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $bundletool" | sha256sum -c -
          bundle=app/build/outputs/bundle/release/app-release.aab
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          java -jar "$bundletool" validate --bundle="$bundle"
          test "$(java -jar "$bundletool" dump manifest --bundle="$bundle" --xpath='/manifest/@package')" = com.mrzahidbd.garmentsot
          test "$(java -jar "$bundletool" dump manifest --bundle="$bundle" --xpath='/manifest/uses-sdk/@android:targetSdkVersion')" = 36
          for asset in index.html learning.html platform-files.js tracker.css; do
            unzip -p "$bundle" "base/assets/$asset" | cmp - "app/src/main/assets/$asset"
            unzip -p "$apk" "assets/$asset" | cmp - "app/src/main/assets/$asset"
          done
          mkdir -p release-files
          cp "$apk" "$bundle" "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" release-files/

      - uses: actions/upload-artifact@v4
        with:
          name: garments-ot-tracker-release-for-signing
          path: release-files/
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: garments-ot-tracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check the release on an Android 16 emulator
        if: github.ref == 'refs/heads/build/play-1.0.1'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          image='system-images;android-36;google_apis;x86_64'
          "$sdk/sdkmanager" 'emulator' 'platform-tools' "$image"
          export ANDROID_USER_HOME="$HOME/.android"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          avd="$ANDROID_AVD_HOME/tracker-phone.avd"
          "$sdk/avdmanager" create avd --force --name tracker-phone --package "$image" --device pixel --path "$avd" </dev/null
          test -s "$avd/config.ini"
          if ! test -s "$ANDROID_AVD_HOME/tracker-phone.ini"; then
            printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-36\n' "$avd" > "$ANDROID_AVD_HOME/tracker-phone.ini"
          fi
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx tracker-phone
          if test -e /dev/kvm; then sudo chown "$(id -u):$(id -g)" /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd tracker-phone -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/tracker-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          command -v adb
          for tick in {1..75}; do
            if adb devices | grep -q 'emulator-'; then break; fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then tail -70 "$RUNNER_TEMP/tracker-emulator.log"; exit 1; fi
            sleep 2
          done
          timeout 35 adb wait-for-device || { tail -70 "$RUNNER_TEMP/tracker-emulator.log"; exit 1; }
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          adb shell wm dismiss-keyguard
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          export OT_DEVICE_KEY_PASSWORD
          OT_DEVICE_KEY_PASSWORD="$(openssl rand -hex 24)"
          test_key="$RUNNER_TEMP/device-test.p12"
          keytool -genkeypair -alias device-check -keyalg RSA -keysize 2048 -validity 7 -storetype PKCS12 -keystore "$test_key" -storepass:env OT_DEVICE_KEY_PASSWORD -dname "CN=Ephemeral Device Check"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$test_key" --ks-key-alias device-check --ks-pass env:OT_DEVICE_KEY_PASSWORD --out "$RUNNER_TEMP/check.apk" release-files/app-release-unsigned.apk
          adb install -r "$RUNNER_TEMP/check.apk"
          python3 tools/check-android-device.py
